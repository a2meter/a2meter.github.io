<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion2 Meter - 다운로드</title>
    <meta name="description" content="아이온 2 전투 분석 도구 - A2Meter 다운로드">
    <meta property="og:title" content="Aion2 Meter">
    <meta property="og:description" content="아이온 2 전투 분석 도구">
    <meta property="og:type" content="website">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #0a0e1a;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(64, 120, 200, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(180, 100, 220, 0.12) 0%, transparent 50%);
            color: #e8ecf4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 720px;
            width: 100%;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(100, 160, 255, 0.12);
            border: 1px solid rgba(100, 160, 255, 0.3);
            border-radius: 999px;
            font-size: 12px;
            color: #8ab4ff;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #a8c5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 18px;
            color: #9aa5b8;
            margin-bottom: 48px;
            line-height: 1.6;
        }

        .download-section {
            background: rgba(20, 28, 48, 0.6);
            border: 1px solid rgba(100, 140, 200, 0.2);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(10px);
            margin-bottom: 32px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 40px;
            background: linear-gradient(135deg, #4a7dd9 0%, #6b5ddb 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 20px rgba(74, 125, 217, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(74, 125, 217, 0.6);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .file-info {
            margin-top: 20px;
            font-size: 14px;
            color: #7a869e;
        }

        .file-info code {
            background: rgba(100, 140, 200, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #a8c5ff;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .links a {
            color: #8ab4ff;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s ease;
        }

        .links a:hover {
            color: #b8d2ff;
        }

        .release-notes {
            text-align: left;
            margin-top: 40px;
        }

        .release-notes h2 {
            font-size: 20px;
            font-weight: 600;
            color: #c8d4ec;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(100, 140, 200, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .release-notes h2::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #4a7dd9, #6b5ddb);
            border-radius: 2px;
        }

        .release-status {
            text-align: center;
            color: #7a869e;
            font-size: 14px;
            padding: 24px;
        }

        .release {
            background: rgba(20, 28, 48, 0.5);
            border: 1px solid rgba(100, 140, 200, 0.15);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .release > summary {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease;
            list-style: none;
        }

        .release > summary::-webkit-details-marker {
            display: none;
        }

        .release > summary:hover {
            background: rgba(100, 140, 200, 0.06);
        }

        .release-title {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .release-tag {
            font-size: 15px;
            font-weight: 600;
            color: #e8ecf4;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .release-latest-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(74, 217, 138, 0.15);
            border: 1px solid rgba(74, 217, 138, 0.35);
            border-radius: 999px;
            font-size: 11px;
            color: #6fe3a4;
            letter-spacing: 0.5px;
        }

        .release-date {
            font-size: 13px;
            color: #7a869e;
        }

        .release-toggle {
            color: #7a869e;
            font-size: 11px;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .release[open] .release-toggle {
            transform: rotate(180deg);
        }

        .release-body {
            padding: 8px 20px 20px;
            color: #c8d0e0;
            font-size: 14px;
            line-height: 1.75;
        }

        .release-body h3 {
            font-size: 13px;
            font-weight: 600;
            color: #a8c5ff;
            margin: 14px 0 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .release-body h3:first-child {
            margin-top: 0;
        }

        .release-body ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .release-body li {
            position: relative;
            padding-left: 16px;
            margin-bottom: 4px;
        }

        .release-body li::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 11px;
            width: 4px;
            height: 4px;
            background: #4a7dd9;
            border-radius: 50%;
        }

        .footer {
            margin-top: 48px;
            font-size: 13px;
            color: #5a6478;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 44px;
            }

            .subtitle {
                font-size: 16px;
            }

            .download-section {
                padding: 28px 20px;
            }

            .download-btn {
                padding: 16px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">AION 2 · COMBAT METER</div>
        <h1>Aion2 Meter</h1>
        <p class="subtitle">
            아이온 2 전투 분석 도구<br>
            실시간 DPS 및 전투 데이터를 확인하세요.
        </p>

        <div class="download-section">
            <a href="https://github.com/a2meter/Aion2Meter/releases/latest/download/A2Meter_Installer.exe"
               class="download-btn"
               download>
                <svg class="download-icon" viewBox="0 0 24 24">
                    <path d="M12 3a1 1 0 0 1 1 1v9.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.42l3.3 3.3V4a1 1 0 0 1 1-1zm-7 15a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/>
                </svg>
                A2Meter 설치하기
            </a>

            <p class="file-info">
                Windows x64
            </p>

            <div class="links">
                <a href="https://github.com/a2meter/Aion2Meter/releases/latest" target="_blank" rel="noopener">
                    릴리스 노트 보기 →
                </a>
                <a href="https://github.com/a2meter/Aion2Meter" target="_blank" rel="noopener">
                    GitHub 저장소 →
                </a>
            </div>
        </div>

        <section class="release-notes">
            <h2>릴리즈 노트</h2>

            <div id="release-list">
                <p class="release-status">불러오는 중...</p>
            </div>

            <p style="text-align: center; margin-top: 20px;">
                <a href="https://github.com/a2meter/Aion2Meter/releases" target="_blank" rel="noopener"
                   style="color: #8ab4ff; text-decoration: none; font-size: 14px;">
                    전체 릴리즈 기록 →
                </a>
            </p>
        </section>

        <script>
            (function () {
                const API_URL = 'https://api.github.com/repos/a2meter/Aion2Meter/releases?per_page=5';
                const container = document.getElementById('release-list');

                function escapeHtml(str) {
                    return str.replace(/[&<>"']/g, ch => ({
                        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                    }[ch]));
                }

                function renderBody(markdown) {
                    if (!markdown || !markdown.trim()) return '<p style="color:#7a869e">변경 사항 정보가 없습니다.</p>';

                    const lines = markdown.replace(/\r\n/g, '\n').split('\n');
                    let html = '';
                    let inList = false;

                    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };

                    for (let raw of lines) {
                        const line = raw.trim();
                        if (!line) { closeList(); continue; }

                        if (/^[-*]\s+/.test(line)) {
                            if (!inList) { html += '<ul>'; inList = true; }
                            html += `<li>${escapeHtml(line.replace(/^[-*]\s+/, ''))}</li>`;
                        } else if (/^#{1,6}\s+/.test(line)) {
                            closeList();
                            html += `<h3>${escapeHtml(line.replace(/^#{1,6}\s+/, ''))}</h3>`;
                        } else {
                            closeList();
                            if (line.length < 30 && !/[.!?。]$/.test(line)) {
                                html += `<h3>${escapeHtml(line)}</h3>`;
                            } else {
                                html += `<p>${escapeHtml(line)}</p>`;
                            }
                        }
                    }
                    closeList();
                    return html;
                }

                function formatDate(iso) {
                    if (!iso) return '';
                    return iso.slice(0, 10);
                }

                function render(releases) {
                    if (!releases.length) {
                        container.innerHTML = '<p class="release-status">릴리즈가 없습니다.</p>';
                        return;
                    }

                    container.innerHTML = releases.map((r, idx) => {
                        const name = escapeHtml(r.name || r.tag_name || '');
                        const date = formatDate(r.published_at);
                        const isLatest = idx === 0;
                        const latestBadge = isLatest ? '<span class="release-latest-badge">LATEST</span>' : '';
                        const openAttr = isLatest ? ' open' : '';

                        return `
                            <details class="release"${openAttr}>
                                <summary>
                                    <div class="release-title">
                                        <span class="release-tag">${name}</span>
                                        ${latestBadge}
                                        <span class="release-date">${date}</span>
                                    </div>
                                    <span class="release-toggle">▼</span>
                                </summary>
                                <div class="release-body">${renderBody(r.body || '')}</div>
                            </details>
                        `;
                    }).join('');
                }

                fetch(API_URL, { headers: { 'Accept': 'application/vnd.github+json' } })
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => render(data.filter(r => !r.draft).slice(0, 5)))
                    .catch(err => {
                        container.innerHTML = `
                            <p class="release-status">
                                릴리즈 정보를 불러오지 못했습니다.
                                <a href="https://github.com/a2meter/Aion2Meter/releases"
                                   target="_blank" rel="noopener"
                                   style="color: #8ab4ff;">GitHub에서 직접 확인 →</a>
                            </p>`;
                        console.error('release fetch failed:', err);
                    });
            })();
        </script>

        <p class="footer">
            © Aion2 Meter · 비공식 커뮤니티 도구
        </p>
    </div>
</body>
</html>
